ai_usage_summary: |
  Google Gemini was used for code generation, implementation assistance, and code optimization.
  ChatGPT was used for architecture discussions, debugging, documentation, README preparation,
  presentation refinement, and technical review. The feature engineering pipeline, semantic
  retrieval workflow, and hybrid ranking logic were designed, implemented, and integrated by the team.

methodology_summary: |
  Challenge-specific hybrid candidate ranking system combining handcrafted feature
  engineering with semantic retrieval. Candidate profiles are scored using manually
  engineered recruitment heuristics derived from the provided AI Engineering job
  description. Sentence Transformers generate semantic embeddings that are indexed
  with FAISS for efficient similarity search. Final ranking combines semantic
  similarity (60%) and feature score (40%) to produce deterministic rankings and
  recruiter-friendly explanations. The implementation is optimized for the
  challenge's AI Engineering role rather than arbitrary job descriptions.

